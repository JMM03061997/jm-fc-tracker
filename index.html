<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JM FC Tracker 2.5 - Atualizado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>JM FC Tracker 2.5</h1>
    <p>Dados armazenados localmente</p>
  </div>

  <!-- Campo com Jogadores Titulares (Cartas Animadas WebP) -->
  <div class="campo-container">
    <div id="campo" class="campo">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </div>

  <!-- Banco de Reservas e Elenco (Cartas PNG Fixas) -->
  <div class="elenco-section">
    <h2>Banco de Reservas e Elenco</h2>
    <div id="elenco-grid" class="elenco-grid">
      <!-- Inserido dinamicamente via JS -->
    </div>
  </div>

  <!-- Modal do Jogador (Estatísticas Expandidas) -->
  <div id="modal-container" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="fechar-btn" onclick="fecharModal()">✕</button>
      <h2 id="modal-nome">Nome do Jogador</h2>
      
      <div class="modal-body">
        <!-- Lado Esquerdo: Imagem Completa de Atributos/Estatísticas -->
        <div class="modal-imagem-container">
          <img id="modal-img-atributos" src="" alt="Atributos do Jogador" class="img-atributos-detalhada">
        </div>
        
        <!-- Lado Direito: Dados de Desempenho no App -->
        <div class="modal-stats-container">
          <div class="stat-box">
            <span class="stat-label">Partidas Totais Jogadas:</span>
            <span id="stat-partidas" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Gols marcados:</span>
            <span id="stat-gols" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Assistências:</span>
            <span id="stat-assistencias" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Participações Diretas em Gols:</span>
            <span id="stat-participacoes" class="stat-value">0</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Prêmios de MVP:</span>
            <span id="stat-mvp" class="stat-value">0</span>
          </div>
          <div class="stat-box highlight">
            <span class="stat-label">Média de gols/partida:</span>
            <span id="stat-media" class="stat-value">0.00</span>
          </div>

          <div class="modal-acoes">
            <button class="btn-trocar">Trocar imagem da carta</button>
            <button class="btn-antigos">Mover p/ Antigos</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
